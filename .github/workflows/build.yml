name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - run: npm ci

      # The small custom installer that people download.
      - name: Build Axiom-Setup.exe
        run: cargo build --release --manifest-path installer/Cargo.toml

      - name: Build full installer
        run: npx electron-builder --win nsis --publish never

      # A v* tag, or running this workflow with "release" ticked, publishes a
      # GitHub release: both installers plus the files auto update reads.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          ls dist
          extra=$(ls dist/*.blockmap dist/latest.yml 2>/dev/null || true)
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "Axiom $version" \
            --notes "Download **Axiom-Setup.exe** and run it. It installs the latest Axiom and keeps it up to date. Axiom-Full-Setup.exe is the standard offline installer." \
            installer/target/release/Axiom-Setup.exe \
            dist/Axiom-Full-Setup.exe \
            $extra

      - uses: actions/upload-artifact@v4
        with:
          name: Axiom-Windows
          path: |
            installer/target/release/Axiom-Setup.exe
            dist/Axiom-Full-Setup.exe
          if-no-files-found: error
          retention-days: 14
