name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer
      - run: npm ci

      # The small custom installer that people download.
      - name: Build Obsidian-Setup.exe
        run: cargo build --release --manifest-path installer/Cargo.toml

      # Tags like v0.2.0 publish a GitHub release: the full installer and update
      # files from electron-builder, plus the small custom installer.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach custom installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "${{ github.ref_name }}" installer/target/release/Obsidian-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Every other push builds the installers so they can be downloaded from the run page.
      - name: Build full installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Obsidian-Windows
          path: |
            installer/target/release/Obsidian-Setup.exe
            dist/Obsidian-Full-Setup.exe
          if-no-files-found: error
          retention-days: 14
